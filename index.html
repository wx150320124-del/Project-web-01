<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="profile-card">
            <div class="photo-wrap">
                <img src="\IMG_3089.png" alt="รูปภาพประจำตัว">
            </div>

            <div class="profile-info">
                <p class="eyebrow">HELLO, I'M</p>
                <h1>นางสาววิภาดา  บรรณจิต</h1>

                <div class="info-grid">
                    <div class="info-box">
                        <span>อายุ</span>
                        <strong>18 ปี</strong>
                    </div>
                    <div class="info-box">
                        <span>แผนก</span>
                        <strong>เทคโนโลยีสารสนเทศ</strong>
                    </div>
                    <div class="info-box">
                        <span>ชื่อเล่น</span>
                        <strong>ปิ่น</strong>
                    </div>
                    <div class="info-box">
                        <span>อาหารที่ชอบ</span>
                        <strong>หมาล่า</strong>
                    </div>
                </div>

                <p class="bio">
                    ฉันชอบการเรียนรู้สิ่งใหม่ และมีความสนใจด้านการออกแบบเว็บ,
                    การเขียนโค้ด และการทำงานร่วมกับผู้อื่น เพื่อพัฒนาทักษะ
                    และสร้างสิ่งที่มีประโยชน์ให้กับสังคม
                </p>

                <div class="tags">
                    <span>Creative</span>
                    <span>Friendly</span>
                    <span>Learning</span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
